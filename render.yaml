services:
  - type: web
    name: skylark-monday-bi-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: MONDAY_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
